name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - run: dotnet run --project src/SentryNet.Cli -c Release --no-build -- demo --output artifacts/demo --formats json,html,sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet format --verify-no-changes
      - run: dotnet pack src/SentryNet.Cli -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-tool
          path: artifacts/packages/*.nupkg
