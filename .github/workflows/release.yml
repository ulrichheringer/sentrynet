name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/SentryNet.Cli -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: sentrynet-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/
  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet pack src/SentryNet.Cli -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: sentrynet-dotnet-tool
          path: artifacts/packages/*.nupkg
